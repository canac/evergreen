name: Evergreen
on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: [.github/workflows/evergreen.yml, summarize.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  find:
    name: Find pnpm repos
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.find.outputs.repos }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - id: find
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repos=$(gh api --paginate /installation/repositories \
              --jq '.repositories[] | select((.archived or .fork) | not) | .name' |
            while read -r r; do
              gh api "repos/$OWNER/$r/contents/pnpm-lock.yaml" --silent 2>/dev/null && echo "$r"
            done | jq --raw-input --slurp --compact-output 'split("\n") | map(select(. != ""))')
          echo "Found: $repos"
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

  fix:
    name: Fix ${{ matrix.repo }}
    needs: find
    if: needs.find.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.find.outputs.repos) }}
    defaults:
      run:
        working-directory: repo
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ matrix.repo }}

      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ matrix.repo }}
          token: ${{ steps.app.outputs.token }}
          path: repo

      # Stops npm security PRs from Dependabot. Other ecosystems keep theirs.
      - name: Add Dependabot config
        run: |
          [ -e .github/dependabot.yml ] && exit 0
          mkdir --parents .github
          cat > .github/dependabot.yml <<'EOF'
          version: 2
          updates:
            - package-ecosystem: npm
              directory: /
              schedule:
                interval: weekly
              ignore:
                - dependency-name: "*"
          EOF

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: repo/package.json

      - name: Fix vulnerabilities
        id: fix
        env:
          PNPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          pnpm audit --json > "$RUNNER_TEMP/before.json" || true
          node ../summarize.mjs snapshot
          pnpm audit --fix=update || true
          pnpm audit --json > "$RUNNER_TEMP/after.json" || true
          node ../summarize.mjs

      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          path: repo
          branch: evergreen/security-fixes
          title: ${{ steps.fix.outputs.title }}
          commit-message: ${{ steps.fix.outputs.commit-message }}
          body-path: ${{ runner.temp }}/body.md
          reviewers: ${{ github.repository_owner }}
